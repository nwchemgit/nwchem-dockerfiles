name: nwchem_crosscompile_docker

on:
  push:
  pull_request:
  release:
  schedule:
    - cron: '59 15 * * FRI'
  repository_dispatch:
    types: [backend_automation]
  workflow_dispatch:
  workflow_call:   # makes it reusable

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.set-release.outputs.release_branch }}
      reuse: ${{ steps.set-reuse-step.outputs.reuse }}
    steps:
      - id: set-release
        run: echo "release_branch=\"hotfix\/release-7-3-0\"" >> $GITHUB_OUTPUT
      - name: dump_env
        run: |
          set -ex
          echo
          echo "github.workflow:" ${{ github.workflow }}
          echo GW ${{ github.workflow_ref }} 
          echo JW ${{ job.workflow_ref }} 
          echo
          echo "conditional" ${{ github.workflow_ref != job.workflow_ref }}
          set +ex
      - id: set-reuse-step
        run: |
          if [[ ${{ github.workflow_ref != job.workflow_ref }} ]]; then
             echo "reuse=false" >> $GITHUB_OUTPUT
          else
             echo "reuse=true" >> $GITHUB_OUTPUT
          fi
      - name: do_check_false
        # This job only runs if it is being called as a reusable workflow
        if: ${{ github.workflow_ref != job.workflow_ref }}
        run: |
          echo "This job is running inside a reusable workflow!"
          echo "set reuse-variable equal ${{ steps.set-reuse-step.outputs.reuse }}"
      - name: do_check_true
        if: ${{ github.workflow_ref == job.workflow_ref }}
        run: |
          echo "This job is NOT running inside a reusable workflow!"
          echo "set reuse-variable equal ${{ steps.set-reuse-step.outputs.reuse }}"
  docker_schedule:
    needs: init
    strategy:
        fail-fast: false
        matrix:
          archs:
            - linux/amd64
            - linux/ppc64le
            - linux/riscv64
          fc: [ gfortran]
          branch:
            - master
            - ${{ fromJSON(needs.init.outputs.release_branch) }}
          armci_network:
            - MPI-PR
          os:
            - ubuntu-latest
          include:
            - archs: linux/arm64
              fc: gfortran
              branch: ${{ fromJSON(needs.init.outputs.release_branch) }}
              armci_network: MPI-PR
              os: ubuntu-24.04-arm
            - {archs: linux/arm64, fc: gfortran, branch: master, armci_network: MPI-PR, os: ubuntu-24.04-arm}
            - {archs: linux/arm64, fc: gfortran, branch: master, armci_network: MPI-TS, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 420
    steps:
      - name: print matrix branch
        run: |
          echo "matrix branch: ${{ matrix.branch }}"
      - name: reuse value true
        if:  ${{ fromJSON(needs.init.outputs.reuse)}}
        run: echo "reuse = true"
      - name: reuse value false
        if:  ${{ !fromJSON(needs.init.outputs.reuse)}}
        run: echo "reuse = false"
      - name: set folder name
        run: |
          echo "folder=nwchem-cross" >> $GITHUB_ENV
      - name: set ubuntu tag
        run: |
          echo "ubuntu_tag=ubuntu:plucky" >> $GITHUB_ENV
      - name: set release branch
        run: |
          echo "setting env.release_branch as ${{ fromJSON(needs.init.outputs.release_branch) }}"
          echo "release_branch=${{ fromJSON(needs.init.outputs.release_branch) }}" >> $GITHUB_ENV
      - name: check if repository_owner has a nwchem-dockerfiles repository
        run: |
            if git ls-remote https://github.com/${{ github.repository_owner }}/nwchem-dockerfiles HEAD; then
               echo "${{ github.repository_owner }} has a nwchem-dockerfiles repository"
               echo "repo_owner=${{ github.repository_owner }}" >> $GITHUB_ENV
            else
               echo "${{ github.repository_owner }} does not have a nwchem-dockerfiles repository"
               echo "repo_owner=nwchemgit" >> $GITHUB_ENV
            fi
      - name: print name of owner we use for nwchem-dockerfiles repository
        run: |
          echo "we will use  ${{ env.repo_owner }} as owner for  nwchem-dockerfiles"
      - name: check if repository_owner has a nwchem release branch
        run: |
            if git ls-remote https://github.com/${{ github.repository_owner }}/nwchem | grep refs/heads/${{ env.release_branch }}; then
               echo "${{ github.repository_owner }} has a nwchem ${{ env.release_branch }} branch"
               echo "release_owner=${{ github.repository_owner }}" >> $GITHUB_ENV
            else
               echo "${{ github.repository_owner }} does not have a nwchem ${{ env.release_branch }} branch"
               echo "release_owner=nwchemgit" >> $GITHUB_ENV
            fi
      - name: do_release_owner
        if: ${{ matrix.branch == env.release_branch }}
        run: echo "nwchem_repo_owner=${{ env.release_owner }}" >> $GITHUB_ENV
      - name: do_master_owner
        if: ${{ matrix.branch != env.release_branch }}
        run: echo "nwchem_repo_owner=${{ github.repository_owner }}" >> $GITHUB_ENV
      - name: print name of owner we use for the nwchem branch used in this job
        run: |
          echo "we will use ${{ env.nwchem_repo_owner }} as owner for the nwchem ${{ matrix.branch }} branch"
      - name: pkg cleanup
        uses: edoapra/ubuntu-pkg-cleanup@main
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo_owner }}/nwchem-dockerfiles
      - name: Setup cache
        id: setup-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/cache
          key: ${{ env.folder}}-${{ matrix.fc}}/${{ matrix.archs}}${{ matrix.branch }}-nwchemdockercross-v001
      - name: Qemu
        if: ${{ matrix.archs != 'linux/amd64' }}
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: ${{ matrix.archs }}
      - name: Available platforms
        if: ${{ matrix.archs != 'linux/amd64' }}
        run: echo ${{ steps.qemu.outputs.platforms }}
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
              image=moby/buildkit:v0.18.2
              network=host
          buildkitd-flags: --debug
      - name: pause
        run: |
          sleep 10s
      - name: Set up Docker Buildx (retry)
        if: ${{ failure() }}
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
              image=moby/buildkit:v0.18.2
              network=host
          buildkitd-flags: --debug
      - name: Login to GitHub Container Registry
        if: ${{ github.actor == github.repository_owner }}
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Arch
        id: get-arch
        run: |
          echo "arch=$(echo ${{matrix.archs }} | sed 's/linux//'|sed  's/\///g' )" >> $GITHUB_ENV
        shell: bash
      - name: FC tag
        id: fc-tag
        run: |
          if [[ ${{ matrix.fc }} == 'gfortran'  ]]; then 
            echo "fc="  >> $GITHUB_ENV
          else 
            echo "fc=$(echo -${{matrix.fc }}  )"   >> $GITHUB_ENV
          fi
        shell: bash
      - name: fetch cache
        if: (steps.setup-cache.outputs.cache-hit == 'true')
        run: |
          cd ${{ env.folder }}
          ls -lrta
          if [[ -f ~/cache/libext.tar.bz2 ]]; then \
          echo "libext cache present" ; \
          mkdir -p cache|| true ; \
          rsync -av ~/cache/libext* cache/. ; \
          echo "libext cache fetched" ; \
          if [[ -f ~/cache/simint.tar.bz2 ]]; then \
          echo "simint cache present" ; \
          mkdir -p cache|| true ; \
          rsync -av ~/cache/simint* cache/. ; \
          echo "simint cache fetched" ; \
          fi
          ls -l cache/ ; \
          echo "======" ; \
          fi
          echo "cache_hit=Y" >> $GITHUB_ENV
      - name: negative-cache-hit-reporter
        if: (steps.setup-cache.outputs.cache-hit != 'true')
        run: |
          echo "cache_hit=N" >> $GITHUB_ENV
      - name: nwchem version tag
        run: |
          if [[ ${{ matrix.branch }} ==  master ]]; then
            echo "nwversion=dev" >> $GITHUB_ENV
          elif [[ ${{ matrix.branch }} ==   ${{ env.release_branch }} ]]; then
            echo "nwversion=731" >> $GITHUB_ENV
          else
            echo "nwversion=unknown" >> $GITHUB_ENV
          fi
        shell: bash
      - name: armci_network tag
        run: |
          if [[ ${{ matrix.armci_network }} ==  MPI-PT ]]; then
            echo "armci_network=" >> $GITHUB_ENV
          else 
            echo "armci_network=-$(echo ${{ matrix.armci_network }}| tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          fi
        shell: bash
      - name: docker tag noarch
        run: |
          echo "tag_noarch=ghcr.io/${{ github.actor }}/nwchemcross-${{ env.nwversion }}${{ env.armci_network }}${{ env.fc }}" >> $GITHUB_ENV
        shell: bash
      - name: docker tag
        run: |
          echo "tag=${{ env.tag_noarch }}:${{ env.arch }}" >> $GITHUB_ENV
        shell: bash
      - name: echo docker tag to env
        id: env_tag
        run:
          echo "tag=${{ env.tag }}" >> $GITHUB_OUTPUT
      - name: echo docker tag_noarch to env
        id: env_tag_noarch
        run:
          echo "tag_noarch=${{ env.tag_noarch }}" >> $GITHUB_OUTPUT
      - name: build date
        id: build-date
        run: |
          echo "date=$(TZ=America/Los_Angeles date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
      - name: print env
        run: |
            echo "GITHUB_ENV" `cat $GITHUB_ENV`
            echo " tag " ${{ env.tag }}
      - name: modify Dockerfile
        run: |
            cd ${{ env.folder }}
            ls
            if [[ ${{ matrix.archs }} ==  'linux/riscv64' ]]; then
            sed -e "s/FROM\ ubuntu\:jammy\ AS\ relink/FROM\ riscv64\/ubuntu\:jammy\ AS\ relink/"  Dockerfile > Dockerfile.new
            sed -e "s/FROM\ ubuntu\:jammy\ AS\ push/FROM\ riscv64\/ubuntu\:jammy\ AS\ push/"  Dockerfile.new > Dockerfile
            grep FROM Dockerfile
            fi
      - name: build_schedule
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.actor == github.repository_owner && github.workflow_ref == job.workflow_ref }}
          provenance: false
          context: ${{ env.folder }}
          shm-size: 256m
          platforms: ${{ matrix.archs }}
          tags: |
            ${{ env.tag }}
            ${{ env.tag }}-${{ env.date }}
          build-args: |
            FC=${{ matrix.fc }}
            NWCHEM_BRANCH=${{ matrix.branch }}
            CACHE_HIT=${{ env.cache_hit }}
            GITHUB_REPOSITORY_OWNER=${{ env.nwchem_repo_owner }}
            UBUNTU_TAG=${{ env.ubuntu_tag }}
            ARMCI_NETWORK=${{ matrix.armci_network }}
      - name: load and test image
        if:  ( github.actor == github.repository_owner && github.workflow_ref == job.workflow_ref )
        run: |
          sleep 30s
          docker pull ${{ env.tag }}
          cd /tmp
          umask u=rwx,g=rwx,o=rwx
          umask -S
          git clone --no-checkout https://github.com/nwchemgit/nwchem
          cd nwchem
          git sparse-checkout init --cone
          git sparse-checkout set QA
          git checkout
          cd QA
          export MPIRUN_PATH=/opt/nwchem/bin/mpiexec
          export NPROCS=1
          if [[ ${{ matrix.armci_network }} == 'MPI-PR' ]]; then
            export NPROCS=2
          fi
          echo "NPROCS is" $NPROCS
          docker run --shm-size 256m --rm --platform ${{matrix.archs }} \
          --user 0 --privileged \
          -w /opt/nwchem/QA \
          -e NWCHEM_EXECUTABLE=/opt/nwchem/bin/nwchem \
          -e MPIRUN_PATH=/opt/nwchem/bin/mpiexec \
          --entrypoint='/opt/nwchem/QA/runtests.mpi.unix' \
          -v `pwd`:/opt/nwchem/QA ${{ env.tag }} procs $NPROCS \
          dft_he2+ h2o_dk cosmo_h3co 

      - name: store cache
        if:  ( github.actor == github.repository_owner )
        run: |
            mkdir -p ~/cache/
            docker run --privileged --user 0 --rm --platform ${{matrix.archs }} \
            --entrypoint='/bin/cp' -v ~/cache:/data \
            ${{ env.tag }} \
            -rp /opt/nwchem/src/libext/libext.tar.bz2 /data/.  || true
            docker run --privileged --user 0 --rm --platform ${{matrix.archs }} \
            --entrypoint='/bin/cp' -v ~/cache:/data \
            ${{ env.tag }} \
            -rp /opt/nwchem/src/libext/simint.tar.bz2 /data/.  || true
            ls -Ralrt ~/cache || true
  bundle_images2:
    needs: [docker_schedule,init]
    if:  ${{ !fromJSON(needs.init.outputs.reuse)}}
    uses: nwchemgit/nwchem-dockerfiles/.github/workflows/docker_manifest_cross.yml@master
    secrets:
      inherit
